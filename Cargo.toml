[package]
name = "bevy_simplesave"
version = "0.0.2"
edition = "2024"
description = "A small, dependency-light crate for saving Bevy Resources to .ron files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unclepomedev/bevy_simplesave"
readme = "README.md"
keywords = ["bevy", "save", "ron", "persistence"]
categories = ["game-development"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ron = "0.12"
directories = "6.0"
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
bevy_app = { version = "0.19", default-features = false, features = ["std"] }
tempfile = "3"
bevy_simplesave_derive = { path = "bevy_simplesave_derive", version = "0.0.2" }

[workspace]
members = [".", "bevy_simplesave_derive"]
