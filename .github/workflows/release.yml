name: Release to crates.io

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Check version consistency
        shell: bash
        run: |
          CORE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bevy_simplesave") | .version')
          DERIVE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bevy_simplesave_derive") | .version')
          TAG_VERSION=${GITHUB_REF_NAME#v}

          echo "Core: $CORE_VERSION, Derive: $DERIVE_VERSION, Tag: $TAG_VERSION"

          if [ "$CORE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! bevy_simplesave ($CORE_VERSION) != Tag ($TAG_VERSION)"
            exit 1
          fi

          if [ "$DERIVE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! bevy_simplesave_derive ($DERIVE_VERSION) != Tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Cargo Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -e

          publish() {
            cargo publish -p "$1" --dry-run --locked

            for i in {1..10}; do
              cargo publish -p "$1" --no-verify --locked && return 0
              echo "Attempt $i failed for $1, retrying in 15s..."
              sleep 15
            done
            echo "Failed to publish $1 after 10 attempts"
            return 1
          }

          publish bevy_simplesave_derive
          publish bevy_simplesave
